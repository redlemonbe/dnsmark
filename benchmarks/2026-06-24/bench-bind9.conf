// BIND9 9.20.23 — bench configuration used 2026-06-24
// Server: vm-dr (192.168.8.242), 8 vCPU KVM on dragonrage
// Listener IP: 10.71.20.50 (bench LAN)
// Placed in /etc/bind/named.conf.options
options {
  directory "/var/cache/bind";
  listen-on port 53 { 10.71.20.50; };
  listen-on-v6 { none; };
  allow-query { any; };
  recursion yes;
  dnssec-validation no;
  forwarders { 1.1.1.1; 8.8.8.8; };
  forward only;
  max-cache-size 256m;
  min-cache-ttl 90;  // BIND9 9.20 hard max is 90 s
};
