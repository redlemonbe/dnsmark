# unbound 1.22.0 — bench configuration used 2026-06-24
# Server: vm-dr (192.168.8.242), 8 vCPU KVM on dragonrage
# Listener IP: 10.71.20.50 (bench LAN)
server:
  interface: 10.71.20.50
  port: 53
  do-ip6: no
  access-control: 10.71.20.0/24 allow
  num-threads: 8
  so-reuseport: yes
  so-rcvbuf: 8m
  so-sndbuf: 8m
  msg-cache-size: 256m
  rrset-cache-size: 256m
  num-queries-per-thread: 8192
  outgoing-range: 8192
  cache-min-ttl: 300
  ratelimit: 0
  ip-ratelimit: 0
  verbosity: 0

forward-zone:
  name: "."
  forward-addr: 1.1.1.1
  forward-addr: 8.8.8.8
