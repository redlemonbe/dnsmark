name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            apt: ""
          - target: x86_64-unknown-linux-musl
            apt: musl-tools
          - target: aarch64-unknown-linux-gnu
            apt: gcc-aarch64-linux-gnu libc6-dev-arm64-cross linux-libc-dev-arm64-cross
          - target: aarch64-unknown-linux-musl
            apt: gcc-aarch64-linux-gnu libc6-dev-arm64-cross linux-libc-dev-arm64-cross musl-tools
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies (clang + libbpf for the eBPF object)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang libbpf-dev ${{ matrix.apt }}
      - name: Toolchain + cross env
        run: |
          rustup target add ${{ matrix.target }}
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu)
              {
                echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
                echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
                echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
                echo "RING_HOST_CC=gcc"
              } >> "$GITHUB_ENV" ;;
            aarch64-unknown-linux-musl)
              {
                echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc"
                echo "CC_aarch64_unknown_linux_musl=aarch64-linux-gnu-gcc"
                echo "AR_aarch64_unknown_linux_musl=aarch64-linux-gnu-ar"
                echo "RING_HOST_CC=gcc"
              } >> "$GITHUB_ENV" ;;
          esac
      - name: aarch64 — expose asm/* headers for the eBPF clang compile
        if: contains(matrix.target, 'aarch64')
        run: |
          # build.rs compiles the (arch-neutral) eBPF object with `clang -target bpf`
          # and looks for /usr/include/aarch64-linux-gnu. The arm64-cross packages
          # install under /usr/aarch64-linux-gnu/ instead, so expose the x86 asm/*
          # headers at the expected path — the __u32/etc. typedefs are identical for
          # a BPF-target compile.
          if [ ! -e /usr/include/aarch64-linux-gnu/asm/types.h ]; then
            sudo mkdir -p /usr/include/aarch64-linux-gnu
            sudo ln -sfn /usr/include/x86_64-linux-gnu/asm /usr/include/aarch64-linux-gnu/asm
          fi
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage artifact
        run: |
          mkdir -p out
          cp "target/${{ matrix.target }}/release/dnsmark" "out/dnsmark-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dnsmark-${{ matrix.target }}
          path: out/dnsmark-${{ matrix.target }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: SBOM (CycloneDX)
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json || true
          mv dnsmark.cdx.json sbom.cdx.json 2>/dev/null || true
      - name: Collect assets + checksums
        run: |
          mkdir -p release-assets
          find dl -type f -name "dnsmark-*" -exec cp {} release-assets/ \;
          [ -f sbom.cdx.json ] && cp sbom.cdx.json release-assets/ || true
          cd release-assets
          sha256sum dnsmark-* > SHA256SUMS.txt
          [ -f sbom.cdx.json ] && sha256sum sbom.cdx.json >> SHA256SUMS.txt || true
          ls -lh
      - name: Sign assets with minisign (Run suite key)
        env:
          MINISIGN_SECRET: ${{ secrets.MINISIGN_SECRET }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          if [ -z "$MINISIGN_SECRET" ]; then
            echo "::warning::MINISIGN_SECRET not set — shipping SHA256SUMS without signatures"
            exit 0
          fi
          curl -sSL https://github.com/jedisct1/minisign/releases/download/0.11/minisign-0.11-linux.tar.gz | tar -xz -C /tmp
          MS=$(find /tmp -name minisign -type f -perm -u+x | head -1)
          printf "%s\n" "$MINISIGN_SECRET" > /tmp/minisign.key
          sign() {
            if [ -n "$MINISIGN_PASSWORD" ]; then printf "%s\n" "$MINISIGN_PASSWORD" | "$MS" -S -s /tmp/minisign.key -m "$1";
            else "$MS" -S -s /tmp/minisign.key -m "$1" </dev/null; fi
          }
          cd release-assets
          for f in $(ls | grep -v "\.minisig$"); do sign "$f"; done
          rm -f /tmp/minisign.key
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: dnsmark ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release-assets/*
