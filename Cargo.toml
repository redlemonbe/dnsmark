[package]
name = "dnsmark"
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "High-performance DNS benchmark — drop-in dnsperf replacement"
repository = "https://github.com/redlemonbe/dnsmark"
rust-version = "1.82"

[features]
default = []
xdp = ["dep:aya", "dep:aya-ebpf-bindings"]

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
tikv-jemallocator = "0.6"
hdrhistogram = "7"
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
rand = "0.8"
hickory-proto = "0.24"
socket2 = "0.5"
num_cpus = "1"
libc = "0.2"
parking_lot = "0.12"
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
webpki-roots = "0.26"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
aya = { version = "0.13", optional = true }
aya-ebpf-bindings = { version = "0.1", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
